name: AFTERLIGHT Godot validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.3.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.3
          use-dotnet: false
      - name: Verify engine
        run: godot --version
      - name: Import and parse project
        run: godot --headless --editor --path afterlight --quit
      - name: Run scene and save smoke test
        run: godot --headless --path afterlight --script res://tests/smoke_test.gd
