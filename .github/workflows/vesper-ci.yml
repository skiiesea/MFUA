name: Vesper CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "vesper/**"
      - ".github/workflows/vesper-ci.yml"
  pull_request:
    paths:
      - "vesper/**"
      - ".github/workflows/vesper-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vesper
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vesper:vesper_test_password@localhost:5432/vesper_test?schema=public
      APP_SECRET: ci-only-secret-value-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODkwYWJjZGVmMDE=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vesper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Typecheck server and web
        run: npm run typecheck
      - name: Build web and server
        run: npm run build
